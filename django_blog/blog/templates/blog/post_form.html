{% load static %}
<link rel="stylesheet" href="{% static 'css/post_form.css' %}">
{% extends 'blog/base.html' %}
{% block title %}Post Form{% endblock %}
{% block content %}
<section style="max-width:720px;margin:2rem auto;padding:1.5rem;background:#fff;border-radius:8px;">
    <h2>{% if form.instance.pk %}Edit Post{% else %}Create Post{% endif %}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">{% if form.instance.pk %}Save Changes{% else %}Create{% endif %}</button>
    </form>
    <p><a href="{% url 'post-list' %}">Back to posts</a></p>
</section>
{% endblock %}
