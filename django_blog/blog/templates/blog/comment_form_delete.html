{% load static %}
<link rel="stylesheet" href="{% static 'css/comment_confirm_delete.css' %}">
{% extends 'blog/base.html' %}
{% block title %}Confirm Delete Comment{% endblock %}
{% block content %}
<section style="max-width:720px;margin:2rem auto;padding:1.5rem;background:#fff;border-radius:8px;">
    <h2>Confirm Delete</h2>
    <p>Are you sure you want to delete this comment?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, delete</button>
        <a href="{% url 'post-detail' object.post.pk %}">Cancel</a>
    </form>
</section>
{% endblock %}
