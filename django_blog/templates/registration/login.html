{% load static %}
{% extends 'blog/base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<section class="container">
    <div class="auth-header">
        <img src="{% static 'images/logo.png' %}" alt="logo" class="auth-logo">
        <h2>Login</h2>
    </div>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Login</button>
    </form>
</section>
{% endblock %}
